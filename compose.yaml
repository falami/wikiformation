services:

  app:
    build:
      context: .
    container_name: wikiformation_app
    ports:
      - "8888:80"
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  trainer-reminders:
    build:
      context: .
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "while true; do php bin/console app:trainer-reminders:run --execute --no-interaction; sleep 60; done"]

  database:
    image: mysql:8.0
    container_name: wikiformation_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wikiformation
      MYSQL_USER: wikiformation
      MYSQL_PASSWORD: wikiformation
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - wikiformation_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wikiformation_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    depends_on:
      database:
        condition: service_healthy

volumes:
  wikiformation_mysql: