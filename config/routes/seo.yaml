# Discovery files must be served at the origin root, outside locale prefixes.
app_seo_robots:
  path: /robots.txt
  controller: App\Controller\Public\SeoController::robots
  methods: [GET, HEAD]

app_seo_sitemap:
  path: /sitemap.xml
  controller: App\Controller\Public\SeoController::sitemap
  methods: [GET, HEAD]
