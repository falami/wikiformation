# config/routes.yaml
app_protected_upload:
  path: /uploads/{directory}/{file}
  controller: App\Controller\ProtectedUploadController
  methods: [GET, HEAD]
  requirements:
    directory: 'emargements|proofs|depense|signatures/organisme|tampons/organisme|entreprise/docs|pdf|devis|conventions'
    file: '.+'

redirect_root_to_fr:
  path: /
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults:
    path: /fr/
    permanent: false

home_locale:
  path:
    fr: /fr/
    en: /en/
  controller: App\Controller\Public\PublicController::index

_default:
  resource: ../src/Controller/
  type: attribute
  prefix:
    fr: "/fr"
    en: "/en"
