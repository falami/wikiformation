<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vérification locale des filtres</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/2.2.2/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<link rel="stylesheet" href="/dist/css/list-filters.css?v=3"><link rel="stylesheet" href="/dist/css/datatables-actions.css">
<style>body{background:#f5f6f9;padding:30px}.content{max-width:1100px;margin:auto}.filterbar{padding:20px;background:white;border-radius:20px;margin-bottom:20px}.filtergrid{display:flex}.table-card{background:white;border-radius:20px;padding:20px;margin-bottom:24px}h1{font-size:24px}.header{padding:24px;background:#233342;color:white;border-radius:20px;margin-bottom:24px}td{white-space:nowrap}</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.datatables.net/2.2.2/js/dataTables.min.js"></script><script src="https://cdn.datatables.net/2.2.2/js/dataTables.bootstrap5.min.js"></script><script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
<script defer src="/dist/js/list-filters.js?v=3"></script><script defer src="/dist/js/datatables-actions.js"></script>
</head><body><main class="content"><div class="header"><h1>Sessions · vérification avec données fictives</h1></div>
<div class="filterbar"><div class="filtergrid"><div class="filter-control"><label for="sessionStatusFilter">Statut</label><div class="filterbox"><select id="sessionStatusFilter"><option value="all">Tous</option><option value="draft">Brouillon</option><option value="done">Terminée</option></select></div></div><div class="filter-control"><label for="quarterFilter">Trimestre</label><select id="quarterFilter"><option value="all">Tous</option><option value="1">T1</option><option value="2">T2</option><option value="3">T3</option><option value="4">T4</option></select></div></div><button id="btnReset" class="btn btn-light mt-2">Reset</button></div>
<div class="table-card"><table id="client" class="table w-100"><thead><tr><th>Formation</th><th>Site</th><th>Statut</th><th>Actions</th></tr></thead></table></div>
<h2 class="h5">Sites · filtres serveur</h2><div class="table-card"><table id="server" class="table w-100"><thead><tr><th>Nom</th><th>Ville</th><th>Actions</th></tr></thead></table></div><pre id="request-log"></pre><p id="action-log" role="status"></p></main>
<script>$(function(){
const actions='<div class="btn-group"><a href="#demo" class="btn btn-light" aria-label="Consulter"><i class="bi bi-eye"></i></a><button class="btn btn-light dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-label="Actions"></button><ul class="dropdown-menu"><li><button class="dropdown-item test-action">Modifier</button></li><li><button class="dropdown-item text-danger test-action">Supprimer</button></li></ul></div>';
const client=$('#client').DataTable({scrollX:true,data:[['Bureautique – formation aux usages professionnels','Paris','Brouillon',actions],['Habilitation électrique','Lyon','Terminée',actions],['Formation bureautique','Paris','Terminée',actions]],language:{search:'Rechercher :'},columnDefs:[{targets:3,orderable:false,searchable:false}]});
const decode=v=>v==='all'?null:(v.startsWith('[')?JSON.parse(v):[v]);
const ts=new TomSelect('#sessionStatusFilter',{onChange:v=>{const selected=decode(v); client.column(2).search(selected===null?'':selected.length?selected.map(x=>x==='draft'?'Brouillon':'Terminée').join('|'):'^NEVER$',true,false).draw();}});
$('#quarterFilter').on('change',function(){document.getElementById('action-log').textContent='Trimestres envoyés : '+this.value;});
$('#btnReset').on('click',()=>ts.setValue('all'));
$('#server').DataTable({scrollX:true,serverSide:true,ajax:(request,callback)=>{
 document.getElementById('request-log').textContent=JSON.stringify({wfFilters:request.wfFilters??'{}'});
 const filters=JSON.parse(request.wfFilters||'{}'); const rows=[['Salle A','Paris',actions],['Salle B','Lyon',actions]]; const result=rows.filter(row=>!filters.ville||filters.ville==='*'||filters.ville.includes(row[1]));
 callback({draw:request.draw,recordsTotal:2,recordsFiltered:result.length,data:result,filters:[{key:'ville',label:'Ville',options:[{value:'Paris',label:'Paris'},{value:'Lyon',label:'Lyon'}]}]});
},columnDefs:[{targets:2,searchable:false,orderable:false}]});
$(document).on('click','.test-action',function(){document.getElementById('action-log').textContent=this.textContent+' '+this.closest('tr').cells[0].textContent;});
});</script></body></html>
